<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#121824"/>
    </linearGradient>
    <linearGradient id="layerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18202d"/>
      <stop offset="100%" stop-color="#131924"/>
    </linearGradient>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="620" fill="url(#archBg)"/>
  
  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.02" stroke-width="1">
    <path d="M0,60 H1280 M0,120 H1280 M0,180 H1280 M0,240 H1280 M0,300 H1280 M0,360 H1280 M0,420 H1280 M0,480 H1280 M0,540 H1280" />
    <path d="M60,0 V620 M120,0 V620 M180,0 V620 M240,0 V620 M300,0 V620 M360,0 V620 M420,0 V620 M480,0 V620 M540,0 V620 M600,0 V620 M660,0 V620 M720,0 V620 M780,0 V620 M840,0 V620 M900,0 V620 M960,0 V620 M1020,0 V620 M1080,0 V620 M1140,0 V620 M1200,0 V620" />
  </g>

  <!-- Title -->
  <text x="64" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#f8fafc">Technical Architecture &amp; Runtime Sandboxing</text>
  <text x="64" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">How DeckStream combines unprivileged FUSE overlays, range-hedged HTTP streaming, and Proton compatibility</text>

  <!-- LAYER 1: Remote Storage (Top) -->
  <g transform="translate(64, 100)" filter="url(#boxShadow)">
    <rect width="1152" height="96" rx="12" fill="url(#layerGrad)" stroke="#263346" stroke-width="1.5"/>
    <rect x="20" y="16" width="130" height="24" rx="6" fill="#1e293b"/>
    <text x="85" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#5ab0ff" text-anchor="middle">REMOTE STORAGE</text>
    
    <!-- Storage Sources -->
    <g transform="translate(180, 24)">
      <rect x="0" y="0" width="180" height="50" rx="8" fill="#0d1118" stroke="#1f2937" stroke-width="1"/>
      <text x="90" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#f1f5f9" text-anchor="middle">Personal NAS</text>
      <text x="90" y="40" font-family="sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">TrueNAS / Unraid WebDAV</text>

      <rect x="200" y="0" width="180" height="50" rx="8" fill="#0d1118" stroke="#1f2937" stroke-width="1"/>
      <text x="290" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#f1f5f9" text-anchor="middle">Nextcloud / ownCloud</text>
      <text x="290" y="40" font-family="sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">Encrypted remote storage</text>

      <rect x="400" y="0" width="180" height="50" rx="8" fill="#0d1118" stroke="#1f2937" stroke-width="1"/>
      <text x="490" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#f1f5f9" text-anchor="middle">S3 / MinIO Object Store</text>
      <text x="490" y="40" font-family="sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">Standard HTTP Range</text>

      <rect x="600" y="0" width="180" height="50" rx="8" fill="#0d1118" stroke="#1f2937" stroke-width="1"/>
      <text x="690" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#f1f5f9" text-anchor="middle">Local LAN Server</text>
      <text x="690" y="40" font-family="sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">1 Gbps+ Home Network</text>
    </g>
  </g>

  <!-- Connectors (Down arrows) -->
  <g transform="translate(640, 202)">
    <line x1="0" y1="0" x2="0" y2="24" stroke="#5ab0ff" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="-5,24 0,30 5,24" fill="#5ab0ff"/>
    <rect x="-80" y="4" width="160" height="18" rx="4" fill="#141a24"/>
    <text x="0" y="17" font-family="monospace" font-size="10" fill="#5ab0ff" text-anchor="middle">HTTP/1.1 Range Requests</text>
  </g>

  <!-- LAYER 2: Range Hedging & VFS Engine (Middle) -->
  <g transform="translate(64, 238)" filter="url(#boxShadow)">
    <rect width="1152" height="120" rx="12" fill="url(#layerGrad)" stroke="#263346" stroke-width="1.5"/>
    <rect x="20" y="16" width="170" height="24" rx="6" fill="#1e293b"/>
    <text x="105" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle">VIRTUAL FILESYSTEM (VFS)</text>
    
    <!-- Subsystems -->
    <g transform="translate(200, 22)">
      <!-- Box A: Range Hedge Proxy -->
      <rect x="0" y="0" width="220" height="76" rx="8" fill="#0d1118" stroke="#10b981" stroke-width="1.2"/>
      <text x="110" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#f1f5f9" text-anchor="middle">hedge_proxy.py</text>
      <text x="110" y="40" font-family="sans-serif" font-size="10.5" fill="#10b981" text-anchor="middle">Range-request hedging</text>
      <text x="110" y="58" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Races duplicate reads &gt;200ms</text>

      <!-- Box B: rclone VFS -->
      <rect x="240" y="0" width="220" height="76" rx="8" fill="#0d1118" stroke="#334155" stroke-width="1"/>
      <text x="350" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#f1f5f9" text-anchor="middle">rclone VFS Chunk Cache</text>
      <text x="350" y="40" font-family="sans-serif" font-size="10.5" fill="#5ab0ff" text-anchor="middle">Rolling local cache</text>
      <text x="350" y="58" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Strictly read-only lower layer</text>

      <!-- Box C: fuse-overlayfs -->
      <rect x="480" y="0" width="220" height="76" rx="8" fill="#0d1118" stroke="#f1b647" stroke-width="1.2"/>
      <text x="590" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#f1f5f9" text-anchor="middle">fuse-overlayfs (CoW)</text>
      <text x="590" y="40" font-family="sans-serif" font-size="10.5" fill="#f1b647" text-anchor="middle">Copy-on-Write upper layer</text>
      <text x="590" y="58" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Game writes land on MicroSD</text>

      <!-- Box D: Startup Profiler -->
      <rect x="720" y="0" width="200" height="76" rx="8" fill="#0d1118" stroke="#334155" stroke-width="1"/>
      <text x="820" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#f1f5f9" text-anchor="middle">startup_profile.py</text>
      <text x="820" y="40" font-family="sans-serif" font-size="10.5" fill="#a855f7" text-anchor="middle">Byte range access logger</text>
      <text x="820" y="58" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Parallel 16-thread prefetch</text>
    </g>
  </g>

  <!-- Connectors (Down arrows) -->
  <g transform="translate(640, 364)">
    <line x1="0" y1="0" x2="0" y2="24" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="-5,24 0,30 5,24" fill="#10b981"/>
    <rect x="-90" y="4" width="180" height="18" rx="4" fill="#141a24"/>
    <text x="0" y="17" font-family="monospace" font-size="10" fill="#10b981" text-anchor="middle">CoW Merged Handheld Path</text>
  </g>

  <!-- LAYER 3: Handheld Proton Runtime (Bottom) -->
  <g transform="translate(64, 400)" filter="url(#boxShadow)">
    <rect width="1152" height="180" rx="12" fill="url(#layerGrad)" stroke="#263346" stroke-width="1.5"/>
    <rect x="20" y="16" width="180" height="24" rx="6" fill="#1e293b"/>
    <text x="110" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f1b647" text-anchor="middle">STEAMOS RUNTIME &amp; DECKY</text>
    
    <g transform="translate(40, 56)">
      <!-- Runtime 1: UMU & Proton -->
      <rect x="0" y="0" width="340" height="104" rx="10" fill="#0d1118" stroke="#1c2432" stroke-width="1"/>
      <text x="20" y="28" font-family="sans-serif" font-size="14" font-weight="700" fill="#f8fafc">umu-launcher + Proton GE</text>
      <text x="20" y="50" font-family="sans-serif" font-size="12" fill="#94a3b8">Executes non-Steam titles in native Wine runtime</text>
      <text x="20" y="70" font-family="sans-serif" font-size="11" fill="#64748b">DirectX / Vulkan shader pipelines write to local cache</text>
      <text x="20" y="90" font-family="monospace" font-size="11" fill="#5ab0ff">STEAM_COMPAT_DATA_PATH=~/.local/share/Steam/...</text>

      <!-- Runtime 2: Decky QAM & Daemon -->
      <rect x="370" y="0" width="340" height="104" rx="10" fill="#0d1118" stroke="#1c2432" stroke-width="1"/>
      <text x="390" y="28" font-family="sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Decky Loader QAM &amp; Daemon</text>
      <text x="390" y="50" font-family="sans-serif" font-size="12" fill="#94a3b8">deckstream.service (unprivileged user space)</text>
      <text x="390" y="70" font-family="sans-serif" font-size="11" fill="#64748b">Instant battery toggle: 30 FPS cap &amp; low settings</text>
      <text x="390" y="90" font-family="monospace" font-size="11" fill="#10b981">Zero root requirements • Sandboxed 600 config</text>

      <!-- Runtime 3: Saves & Diagnostics -->
      <rect x="740" y="0" width="340" height="104" rx="10" fill="#0d1118" stroke="#1c2432" stroke-width="1"/>
      <text x="760" y="28" font-family="sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Ludusavi &amp; Self-Healing Doctor</text>
      <text x="760" y="50" font-family="sans-serif" font-size="12" fill="#94a3b8">Automatic post-session save snapshots (Ludusavi)</text>
      <text x="760" y="70" font-family="sans-serif" font-size="11" fill="#64748b">suspend-resume-hook.sh handles sleep/wake cleanly</text>
      <text x="760" y="90" font-family="monospace" font-size="11" fill="#f1b647">doctor.py diagnostic self-test suite</text>
    </g>
  </g>
</svg>