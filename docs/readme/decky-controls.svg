<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540">
  <defs>
    <linearGradient id="qamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131d"/>
      <stop offset="100%" stop-color="#151b27"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18202d"/>
      <stop offset="100%" stop-color="#111620"/>
    </linearGradient>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="540" fill="#090c12"/>
  <rect width="1280" height="540" fill="url(#qamBg)" opacity="0.6"/>

  <!-- Header -->
  <text x="64" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#f8fafc">Decky Loader QAM: SteamOS Handheld Controls</text>
  <text x="64" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">Adjust streaming telemetry, battery life presets, cache budgets, and diagnostic self-healing directly in Gaming Mode</text>

  <!-- 3 Feature Highlight Columns -->
  <!-- Column 1: Live Streaming & Throughput Telemetry -->
  <g transform="translate(64, 110)" filter="url(#cardGlow)">
    <rect width="360" height="380" rx="14" fill="url(#cardBg)" stroke="#263346" stroke-width="1.5"/>
    
    <!-- Title Pill -->
    <rect x="20" y="20" width="34" height="34" rx="8" fill="#1e293b"/>
    <text x="37" y="42" font-family="sans-serif" font-size="16" text-anchor="middle">⚡</text>
    <text x="64" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">Live Stream Telemetry</text>
    <text x="64" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Active session metrics &amp; I/O</text>
    
    <!-- Session Box -->
    <rect x="20" y="74" width="320" height="140" rx="10" fill="#0d1118" stroke="#1c2432" stroke-width="1"/>
    <text x="36" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#64748b">RUNNING VIA PROTON GE</text>
    <text x="36" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">Cyberpunk 2077</text>
    
    <!-- Progress Bar -->
    <text x="36" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">VFS Cache: <tspan fill="#f1f5f9" font-weight="700">12.88 GB</tspan> / 60 GB budget</text>
    <rect x="36" y="162" width="288" height="8" rx="4" fill="#1e2838"/>
    <rect x="36" y="162" width="86" height="8" rx="4" fill="#10b981"/>
    
    <text x="36" y="196" font-family="monospace" font-size="11" fill="#10b981">Throughput: 24.5 MB/s • p99: 14ms</text>

    <!-- Sparkline Graph Simulation -->
    <path d="M36 260 L60 252 L90 258 L120 240 L150 244 L180 230 L210 238 L240 226 L270 232 L300 220 L324 224" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
    <path d="M36 260 L60 252 L90 258 L120 240 L150 244 L180 230 L210 238 L240 226 L270 232 L300 220 L324 224 V270 H36 Z" fill="#3b82f6" opacity="0.1"/>
    <text x="36" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Stable 25 MB/s VFS streaming over Wi-Fi 6</text>

    <!-- Key Bullet Points -->
    <text x="20" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">• Zero frame-drops from remote disk spin-up</text>
    <text x="20" y="346" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">• Range-hedging proxy automatically races tail stalls</text>
  </g>

  <!-- Column 2: Per-Game Deck Mode (Battery Saver) -->
  <g transform="translate(460, 110)" filter="url(#cardGlow)">
    <rect width="360" height="380" rx="14" fill="url(#cardBg)" stroke="#263346" stroke-width="1.5"/>
    
    <rect x="20" y="20" width="34" height="34" rx="8" fill="#1e293b"/>
    <text x="37" y="42" font-family="sans-serif" font-size="16" text-anchor="middle">🔋</text>
    <text x="64" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">Per-Game Deck Mode</text>
    <text x="64" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Handheld battery optimization</text>
    
    <!-- Big Toggle Display -->
    <rect x="20" y="74" width="320" height="80" rx="10" fill="#0d1118" stroke="#1c2432" stroke-width="1"/>
    <text x="36" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Deck Mode Preset</text>
    <text x="36" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Capped 30 FPS + Low graphics config</text>
    
    <!-- Switch ON -->
    <rect x="264" y="98" width="56" height="28" rx="14" fill="#3b82f6"/>
    <circle cx="304" cy="112" r="10" fill="#ffffff"/>

    <!-- Comparison Box -->
    <g transform="translate(20, 170)">
      <rect width="320" height="110" rx="8" fill="#131a26"/>
      <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Estimated Battery Life (Cyberpunk 2077):</text>
      
      <text x="16" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#ef4444">Default 60 FPS High:</text>
      <text x="240" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ef4444" text-anchor="end">~1h 40m</text>

      <text x="16" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#10b981">Deck Mode 30 FPS Cap:</text>
      <text x="240" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#10b981" text-anchor="end">~3h 50m (+130%)</text>
    </g>

    <text x="20" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">• Automatically patches GameUserSettings.ini</text>
    <text x="20" y="346" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">• Locks TDP safely to prevent handheld thermal throttling</text>
  </g>

  <!-- Column 3: Self-Healing & Overnight Warmup -->
  <g transform="translate(856, 110)" filter="url(#cardGlow)">
    <rect width="360" height="380" rx="14" fill="url(#cardBg)" stroke="#263346" stroke-width="1.5"/>
    
    <rect x="20" y="20" width="34" height="34" rx="8" fill="#1e293b"/>
    <text x="37" y="42" font-family="sans-serif" font-size="16" text-anchor="middle">🛠️</text>
    <text x="64" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">Self-Healing Doctor</text>
    <text x="64" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Automated diagnostics &amp; warmup</text>
    
    <!-- Warmup Box -->
    <rect x="20" y="74" width="320" height="74" rx="10" fill="#0d1118" stroke="#1c2432" stroke-width="1"/>
    <text x="36" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Smart Startup Warmup</text>
    <text x="36" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Prefetch boot profiles while on charger</text>
    <rect x="264" y="94" width="56" height="28" rx="14" fill="#10b981"/>
    <circle cx="304" cy="108" r="10" fill="#ffffff"/>

    <!-- Doctor Checklist -->
    <g transform="translate(20, 164)">
      <rect width="320" height="116" rx="8" fill="#131a26"/>
      <text x="16" y="26" font-family="sans-serif" font-size="11" font-weight="700" fill="#10b981">✓ Wi-Fi Power Management: OPTIMIZED</text>
      <text x="16" y="50" font-family="sans-serif" font-size="11" font-weight="700" fill="#10b981">✓ DNS Resolution (nas.local): 2.4 ms</text>
      <text x="16" y="74" font-family="sans-serif" font-size="11" font-weight="700" fill="#10b981">✓ MicroSD CoW Upper Layer: EXT4 OK</text>
      <text x="16" y="98" font-family="sans-serif" font-size="11" font-weight="700" fill="#10b981">✓ Ludusavi Saves Snapshot: SYNCED</text>
    </g>

    <text x="20" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">• One-tap cache flush &amp; socket recovery</text>
    <text x="20" y="346" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">• Redacted system bundle export for easy debugging</text>
  </g>
</svg>