<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340">
  <defs>
    <linearGradient id="stepBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151b27"/>
      <stop offset="100%" stop-color="#0f141d"/>
    </linearGradient>
    <filter id="stepShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="340" fill="#0b0e14"/>
  <rect width="1280" height="340" fill="#131924" opacity="0.3"/>

  <!-- Top Title -->
  <text x="32" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#64748b" letter-spacing="1.5">HOW DECKSTREAM RUNS GAMES ON DEMAND</text>

  <!-- Step 1: Storage -->
  <g transform="translate(32, 60)" filter="url(#stepShadow)">
    <rect width="216" height="200" rx="12" fill="url(#stepBg)" stroke="#222b3b" stroke-width="1.5"/>
    <circle cx="36" cy="38" r="16" fill="none" stroke="#5ab0ff" stroke-width="2.5"/>
    <text x="36" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#5ab0ff" text-anchor="middle">1</text>
    <text x="64" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f1f5f9">Storage</text>
    
    <text x="24" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Pick a title from your</text>
    <text x="24" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">personal NAS, WebDAV,</text>
    <text x="24" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Nextcloud, or S3.</text>
    
    <rect x="24" y="152" width="94" height="22" rx="4" fill="#1e2838"/>
    <text x="71" y="167" font-family="monospace" font-size="11" fill="#5ab0ff" text-anchor="middle">HTTP Range</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <g transform="translate(254, 155)">
    <path d="M0 0 H24" stroke="#334155" stroke-width="2.5" stroke-dasharray="4 4"/>
    <polygon points="24,-4 32,0 24,4" fill="#5ab0ff"/>
  </g>

  <!-- Step 2: Queue -->
  <g transform="translate(292, 60)" filter="url(#stepShadow)">
    <rect width="216" height="200" rx="12" fill="url(#stepBg)" stroke="#222b3b" stroke-width="1.5"/>
    <circle cx="36" cy="38" r="16" fill="none" stroke="#5ab0ff" stroke-width="2.5"/>
    <text x="36" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#5ab0ff" text-anchor="middle">2</text>
    <text x="64" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f1f5f9">Queue</text>
    
    <text x="24" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">A lightweight queue</text>
    <text x="24" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">holds the stream job,</text>
    <text x="24" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">behind your credentials.</text>
    
    <rect x="24" y="152" width="100" height="22" rx="4" fill="#1e2838"/>
    <text x="74" y="167" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">Secure Auth</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <g transform="translate(514, 155)">
    <path d="M0 0 H24" stroke="#334155" stroke-width="2.5" stroke-dasharray="4 4"/>
    <polygon points="24,-4 32,0 24,4" fill="#5ab0ff"/>
  </g>

  <!-- Step 3: Deck Service -->
  <g transform="translate(552, 60)" filter="url(#stepShadow)">
    <rect width="216" height="200" rx="12" fill="url(#stepBg)" stroke="#222b3b" stroke-width="1.5"/>
    <circle cx="36" cy="38" r="16" fill="none" stroke="#5ab0ff" stroke-width="2.5"/>
    <text x="36" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#5ab0ff" text-anchor="middle">3</text>
    <text x="64" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f1f5f9">Deck</text>
    
    <text x="24" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">The DeckStream service</text>
    <text x="24" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">mounts the VFS and adds</text>
    <text x="24" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">a Steam Gaming shortcut.</text>
    
    <rect x="24" y="152" width="128" height="22" rx="4" fill="#1e2838"/>
    <text x="88" y="167" font-family="monospace" font-size="11" fill="#5ab0ff" text-anchor="middle">Non-Steam Entry</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <g transform="translate(774, 155)">
    <path d="M0 0 H24" stroke="#334155" stroke-width="2.5" stroke-dasharray="4 4"/>
    <polygon points="24,-4 32,0 24,4" fill="#f1b647"/>
  </g>

  <!-- Step 4: Demand Profiler -->
  <g transform="translate(812, 60)" filter="url(#stepShadow)">
    <rect width="216" height="200" rx="12" fill="url(#stepBg)" stroke="#222b3b" stroke-width="1.5"/>
    <circle cx="36" cy="38" r="16" fill="none" stroke="#f1b647" stroke-width="2.5"/>
    <text x="36" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#f1b647" text-anchor="middle">4</text>
    <text x="64" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f1f5f9">Fill</text>
    
    <text x="24" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Startup profiler pre-fetches</text>
    <text x="24" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">the exact boot ranges</text>
    <text x="24" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">in parallel to local card.</text>
    
    <rect x="24" y="152" width="136" height="22" rx="4" fill="#242217"/>
    <text x="92" y="167" font-family="monospace" font-size="11" fill="#f1b647" text-anchor="middle">Parallel Streams</text>
  </g>

  <!-- Connector 4 -> 5 -->
  <g transform="translate(1034, 155)">
    <path d="M0 0 H24" stroke="#334155" stroke-width="2.5" stroke-dasharray="4 4"/>
    <polygon points="24,-4 32,0 24,4" fill="#10b981"/>
  </g>

  <!-- Step 5: Native Play -->
  <g transform="translate(1072, 60)" filter="url(#stepShadow)">
    <rect width="176" height="200" rx="12" fill="url(#stepBg)" stroke="#222b3b" stroke-width="1.5"/>
    <circle cx="36" cy="38" r="16" fill="none" stroke="#10b981" stroke-width="2.5"/>
    <text x="36" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#10b981" text-anchor="middle">5</text>
    <text x="64" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f1f5f9">Play</text>
    
    <text x="24" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Proton boots instantly;</text>
    <text x="24" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">remaining assets stream</text>
    <text x="24" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">seamlessly in play.</text>
    
    <rect x="24" y="152" width="112" height="22" rx="4" fill="#142621"/>
    <text x="80" y="167" font-family="monospace" font-size="11" fill="#10b981" text-anchor="middle">Native Proton</text>
  </g>

  <!-- Footer explanation (generous breathing space, zero cutoff) -->
  <text x="32" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500" fill="#64748b">
    Ready-to-play directories stream instantly with zero full-install penalty; updates and saves isolate to local Copy-on-Write storage.
  </text>
</svg>