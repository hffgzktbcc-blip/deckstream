<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="100%" stop-color="#141a24" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="660" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.025" stroke-width="1">
    <path d="M0,80 H1280 M0,160 H1280 M0,240 H1280 M0,320 H1280 M0,400 H1280 M0,480 H1280 M0,560 H1280" />
    <path d="M80,0 V660 M160,0 V660 M240,0 V660 M320,0 V660 M400,0 V660 M480,0 V660 M560,0 V660 M640,0 V660 M720,0 V660 M800,0 V660 M880,0 V660 M960,0 V660 M1040,0 V660 M1120,0 V660 M1200,0 V660" />
  </g>

  <!-- Section Title -->
  <text x="640" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#f8fafc" text-anchor="middle">SteamOS Handheld Gaming Mode &amp; Companion App</text>
  <text x="640" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Native Quick Access Menu integration on the Steam Deck alongside the remote library web dashboard</text>

  <!-- LEFT: Steam Deck Handheld Frame & Decky Loader Panel -->
  <g transform="translate(60, 105)" filter="url(#shadow)">
    <!-- Steam Deck Outer Bezel -->
    <rect width="560" height="505" rx="28" fill="#1b1f28" stroke="#2c3342" stroke-width="2"/>
    
    <!-- Screen Bezel -->
    <rect x="24" y="24" width="512" height="457" rx="14" fill="#0b0e14" stroke="#161a22" stroke-width="1"/>
    
    <!-- SteamOS Top Bar -->
    <rect x="24" y="24" width="512" height="34" fill="#121620"/>
    <text x="42" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">SteamOS 3.6 • Gaming Mode</text>
    <text x="500" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#10b981" text-anchor="end">94% ⚡ Wi-Fi 6</text>

    <!-- Background Game Splash Simulation (Left portion of Deck screen) -->
    <rect x="24" y="58" width="512" height="423" fill="#0d1118"/>
    <text x="135" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="900" fill="#1c2436" text-anchor="middle">CYBERPUNK</text>
    <text x="135" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#1c2436" text-anchor="middle">2077</text>
    
    <!-- Decky Loader QAM Flyout Panel (Right Side of Handheld Screen) -->
    <g transform="translate(236, 58)">
      <!-- Panel Base -->
      <rect width="300" height="423" fill="#161c26" stroke="#2d3748" stroke-width="1"/>
      
      <!-- Decky Plugin Header -->
      <rect x="0" y="0" width="300" height="48" fill="#1e2838"/>
      <text x="16" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">🎮 DeckStream</text>
      
      <!-- Status Badge -->
      <rect x="214" y="15" width="70" height="20" rx="10" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1"/>
      <text x="249" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle">ACTIVE</text>
      
      <!-- Session Card -->
      <rect x="12" y="58" width="276" height="102" rx="8" fill="#10151f" stroke="#232d3d" stroke-width="1"/>
      <text x="22" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.5">CURRENT SESSION</text>
      <text x="22" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#f1f5f9">Cyberpunk 2077</text>
      
      <!-- Cache Gauge -->
      <rect x="22" y="112" width="256" height="6" rx="3" fill="#1e2838"/>
      <rect x="22" y="112" width="72" height="6" rx="3" fill="#10b981"/>
      
      <text x="22" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Cache: 12.8 / 60 GB</text>
      <text x="22" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#10b981">Throughput: 24.5 MB/s • p99: 12ms</text>
      
      <!-- Toggle 1: Deck Mode -->
      <rect x="12" y="170" width="276" height="56" rx="8" fill="#10151f" stroke="#232d3d" stroke-width="1"/>
      <text x="22" y="193" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Deck Mode Preset</text>
      <text x="22" y="211" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">30 FPS Cap + Low Settings</text>
      <!-- Switch Toggle ON -->
      <rect x="224" y="186" width="46" height="22" rx="11" fill="#3b82f6"/>
      <circle cx="258" cy="197" r="8" fill="#ffffff"/>

      <!-- Toggle 2: Overnight Warmup -->
      <rect x="12" y="234" width="276" height="56" rx="8" fill="#10151f" stroke="#232d3d" stroke-width="1"/>
      <text x="22" y="257" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Smart Startup Warmup</text>
      <text x="22" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Prefetch while on charger</text>
      <!-- Switch Toggle ON -->
      <rect x="224" y="250" width="46" height="22" rx="11" fill="#10b981"/>
      <circle cx="258" cy="261" r="8" fill="#ffffff"/>

      <!-- Storage Info -->
      <rect x="12" y="298" width="276" height="42" rx="8" fill="#10151f"/>
      <text x="22" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">MicroSD Free: <tspan fill="#f1f5f9" font-weight="700">277 GB</tspan></text>

      <!-- Action Buttons -->
      <rect x="12" y="352" width="132" height="34" rx="6" fill="#1e2838" stroke="#334155" stroke-width="1"/>
      <text x="78" y="374" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1" text-anchor="middle">Clear Cache</text>
      
      <rect x="156" y="352" width="132" height="34" rx="6" fill="#1e2838" stroke="#334155" stroke-width="1"/>
      <text x="222" y="374" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1" text-anchor="middle">Doctor Check</text>
    </g>
  </g>

  <!-- RIGHT: Companion Web Dashboard Frame -->
  <g transform="translate(660, 105)" filter="url(#shadow)">
    <!-- Browser Window Frame -->
    <rect width="560" height="505" rx="16" fill="#121722" stroke="#252d3d" stroke-width="2"/>
    
    <!-- Browser Header / Address Bar -->
    <rect x="0" y="0" width="560" height="44" rx="16" fill="#1a2230"/>
    <circle cx="24" cy="22" r="6" fill="#ef4444"/>
    <circle cx="44" cy="22" r="6" fill="#f59e0b"/>
    <circle cx="64" cy="22" r="6" fill="#10b981"/>
    
    <rect x="110" y="10" width="340" height="24" rx="6" fill="#0d1118"/>
    <text x="280" y="26" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">https://deckstream.local/library</text>
    
    <!-- Companion App Nav -->
    <rect x="0" y="44" width="560" height="46" fill="#161d28" stroke="#232d3d" stroke-width="1"/>
    <text x="28" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#3b82f6">🎮 DeckStream</text>
    
    <text x="180" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#3b82f6">Library</text>
    <rect x="175" y="88" width="50" height="2" fill="#3b82f6"/>
    
    <text x="260" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">Storage</text>
    <text x="340" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">Handheld</text>
    <text x="430" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">Settings</text>

    <!-- Library Content Area -->
    <g transform="translate(24, 110)">
      <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">Mounted Storage Library</text>
      <text x="512" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#10b981" text-anchor="end">● Connected: nas.local</text>
      
      <!-- Game Row 1: Cyberpunk -->
      <g transform="translate(0, 32)">
        <rect width="512" height="68" rx="8" fill="#171f2c" stroke="#263346" stroke-width="1"/>
        <!-- Poster Thumbnail -->
        <rect x="12" y="11" width="46" height="46" rx="4" fill="#2d3748"/>
        <text x="35" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#94a3b8" text-anchor="middle">CP77</text>
        <text x="70" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Cyberpunk 2077</text>
        <text x="70" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">69.2 GB • 12.8 GB ready • Active VFS</text>
        
        <rect x="382" y="19" width="118" height="30" rx="6" fill="#10b981"/>
        <text x="441" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Playing on Deck</text>
      </g>

      <!-- Game Row 2: Baldur's Gate 3 -->
      <g transform="translate(0, 112)">
        <rect width="512" height="68" rx="8" fill="#171f2c" stroke="#263346" stroke-width="1"/>
        <rect x="12" y="11" width="46" height="46" rx="4" fill="#2d3748"/>
        <text x="35" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#94a3b8" text-anchor="middle">BG3</text>
        <text x="70" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Baldur's Gate 3</text>
        <text x="70" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">122.4 GB • Startup Profile (9.4 GB)</text>
        
        <rect x="382" y="19" width="118" height="30" rx="6" fill="url(#btnGrad)"/>
        <text x="441" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Stream to Deck</text>
      </g>

      <!-- Game Row 3: Sifu -->
      <g transform="translate(0, 192)">
        <rect width="512" height="68" rx="8" fill="#171f2c" stroke="#263346" stroke-width="1"/>
        <rect x="12" y="11" width="46" height="46" rx="4" fill="#2d3748"/>
        <text x="35" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#94a3b8" text-anchor="middle">SIFU</text>
        <text x="70" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Sifu</text>
        <text x="70" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">15.8 GB • 7 min cold • Zero wait warm</text>
        
        <rect x="382" y="19" width="118" height="30" rx="6" fill="url(#btnGrad)"/>
        <text x="441" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Stream to Deck</text>
      </g>

      <!-- Game Row 4: Control -->
      <g transform="translate(0, 272)">
        <rect width="512" height="68" rx="8" fill="#171f2c" stroke="#263346" stroke-width="1"/>
        <rect x="12" y="11" width="46" height="46" rx="4" fill="#2d3748"/>
        <text x="35" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#94a3b8" text-anchor="middle">CTRL</text>
        <text x="70" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Control Ultimate Edition</text>
        <text x="70" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">42.1 GB • Unpacked PC ready</text>
        
        <rect x="382" y="19" width="118" height="30" rx="6" fill="url(#btnGrad)"/>
        <text x="441" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Stream to Deck</text>
      </g>
    </g>
  </g>
</svg>