<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="100%" stop-color="#141a24" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="660" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.025" stroke-width="1">
    <path d="M0,80 H1280 M0,160 H1280 M0,240 H1280 M0,320 H1280 M0,400 H1280 M0,480 H1280 M0,560 H1280" />
    <path d="M80,0 V660 M160,0 V660 M240,0 V660 M320,0 V660 M400,0 V660 M480,0 V660 M560,0 V660 M640,0 V660 M720,0 V660 M800,0 V660 M880,0 V660 M960,0 V660 M1040,0 V660 M1120,0 V660 M1200,0 V660" />
  </g>

  <!-- Section Title -->
  <text x="640" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#f8fafc" text-anchor="middle">SteamOS Handheld Gaming Mode &amp; Cartridge Shelf Companion</text>
  <text x="640" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Native Quick Access Menu on the Steam Deck alongside the signature cartridge-shelf web app</text>

  <!-- LEFT: Steam Deck Handheld Frame & Decky Loader Panel -->
  <g transform="translate(60, 105)" filter="url(#shadow)">
    <!-- Steam Deck Outer Bezel -->
    <rect width="560" height="505" rx="28" fill="#1b1f28" stroke="#2c3342" stroke-width="2"/>
    
    <!-- Screen Bezel -->
    <rect x="24" y="24" width="512" height="457" rx="14" fill="#0b0e14" stroke="#161a22" stroke-width="1"/>
    
    <!-- SteamOS Top Bar -->
    <rect x="24" y="24" width="512" height="34" fill="#121620"/>
    <text x="42" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">SteamOS 3.6 • Gaming Mode</text>
    <text x="500" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#10b981" text-anchor="end">94% ⚡ Wi-Fi 6</text>

    <!-- Background Game Splash Simulation -->
    <rect x="24" y="58" width="512" height="423" fill="#0d1118"/>
    <text x="135" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="900" fill="#1c2436" text-anchor="middle">CYBERPUNK</text>
    <text x="135" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#1c2436" text-anchor="middle">2077</text>
    
    <!-- Decky Loader QAM Flyout Panel -->
    <g transform="translate(236, 58)">
      <rect width="300" height="423" fill="#161c26" stroke="#2d3748" stroke-width="1"/>
      
      <!-- Decky Plugin Header -->
      <rect x="0" y="0" width="300" height="48" fill="#1e2838"/>
      <text x="16" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">🎮 DeckStream</text>
      
      <!-- Status Badge -->
      <rect x="214" y="15" width="70" height="20" rx="10" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1"/>
      <text x="249" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle">ACTIVE</text>
      
      <!-- Session Card -->
      <rect x="12" y="58" width="276" height="102" rx="8" fill="#10151f" stroke="#232d3d" stroke-width="1"/>
      <text x="22" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.5">CURRENT SESSION</text>
      <text x="22" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#f1f5f9">Cyberpunk 2077</text>
      
      <!-- Cache Gauge -->
      <rect x="22" y="112" width="256" height="6" rx="3" fill="#1e2838"/>
      <rect x="22" y="112" width="72" height="6" rx="3" fill="#10b981"/>
      
      <text x="22" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Cache: 12.8 / 60 GB</text>
      <text x="22" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#10b981">Throughput: 24.5 MB/s • p99: 12ms</text>
      
      <!-- Toggle 1: Deck Mode -->
      <rect x="12" y="170" width="276" height="56" rx="8" fill="#10151f" stroke="#232d3d" stroke-width="1"/>
      <text x="22" y="193" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Deck Mode Preset</text>
      <text x="22" y="211" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">30 FPS Cap + Low Settings</text>
      <rect x="224" y="186" width="46" height="22" rx="11" fill="#3b82f6"/>
      <circle cx="258" cy="197" r="8" fill="#ffffff"/>

      <!-- Toggle 2: Overnight Warmup -->
      <rect x="12" y="234" width="276" height="56" rx="8" fill="#10151f" stroke="#232d3d" stroke-width="1"/>
      <text x="22" y="257" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Smart Startup Warmup</text>
      <text x="22" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Prefetch while on charger</text>
      <rect x="224" y="250" width="46" height="22" rx="11" fill="#10b981"/>
      <circle cx="258" cy="261" r="8" fill="#ffffff"/>

      <!-- Storage Info -->
      <rect x="12" y="298" width="276" height="42" rx="8" fill="#10151f"/>
      <text x="22" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">MicroSD Free: <tspan fill="#f1f5f9" font-weight="700">277 GB</tspan></text>

      <!-- Action Buttons -->
      <rect x="12" y="352" width="132" height="34" rx="6" fill="#1e2838" stroke="#334155" stroke-width="1"/>
      <text x="78" y="374" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1" text-anchor="middle">Clear Cache</text>
      
      <rect x="156" y="352" width="132" height="34" rx="6" fill="#1e2838" stroke="#334155" stroke-width="1"/>
      <text x="222" y="374" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1" text-anchor="middle">Doctor Check</text>
    </g>
  </g>

  <!-- RIGHT: REAL CARTRIDGE-SHELF COMPANION APP FRAME -->
  <g transform="translate(660, 105)" filter="url(#shadow)">
    <!-- Phone / PWA Frame -->
    <rect width="560" height="505" rx="20" fill="#15181d" stroke="#303641" stroke-width="2"/>
    
    <!-- Graphite Instrument Top Bar -->
    <rect x="0" y="0" width="560" height="48" rx="20" fill="#1c2027"/>
    <rect x="0" y="32" width="560" height="16" fill="#1c2027"/>
    <line x1="0" y1="48" x2="560" y2="48" stroke="#303641" stroke-width="1"/>

    <text x="24" y="31" font-family="'Barlow Condensed', sans-serif" font-size="18" font-weight="700" fill="#5ab0ff" letter-spacing="1">DECKSTREAM</text>
    
    <!-- Status Badges on Top Bar -->
    <g transform="translate(360, 14)">
      <rect width="84" height="20" rx="10" fill="rgba(63,214,164,0.15)" stroke="#3fd6a4" stroke-width="1"/>
      <text x="42" y="14" font-family="sans-serif" font-size="10" font-weight="700" fill="#3fd6a4" text-anchor="middle">DECK ONLINE</text>
    </g>
    <g transform="translate(454, 14)">
      <rect width="88" height="20" rx="10" fill="#242932" stroke="#303641" stroke-width="1"/>
      <text x="44" y="14" font-family="sans-serif" font-size="10" font-weight="600" fill="#a0a8b6" text-anchor="middle">STORAGE OK</text>
    </g>

    <!-- App Body Content Area -->
    <!-- 1. FEATURED HERO CARTRIDGE SPOTLIGHT -->
    <g transform="translate(24, 62)">
      <!-- Spotlight Container -->
      <rect width="512" height="168" rx="12" fill="#1c2027" stroke="#303641" stroke-width="1"/>
      
      <!-- Physical Cartridge on Left with Angled Notch -->
      <g transform="translate(18, 14)">
        <!-- Cartridge Body with Notch -->
        <polygon points="0,0 78,0 94,16 94,140 0,140" fill="#242932" stroke="#303641" stroke-width="1"/>
        <!-- Cartridge Grip Ridges -->
        <rect x="4" y="0" width="3" height="8" fill="#0f1115" opacity="0.6"/>
        <rect x="10" y="0" width="3" height="8" fill="#0f1115" opacity="0.6"/>
        <rect x="16" y="0" width="3" height="8" fill="#0f1115" opacity="0.6"/>
        <rect x="22" y="0" width="3" height="8" fill="#0f1115" opacity="0.6"/>
        
        <!-- Printed Paper Label (Warm Cream #ece7da) -->
        <rect x="8" y="24" width="78" height="106" rx="4" fill="#ece7da"/>
        <!-- Colored Header Stripe -->
        <path d="M8 24 h78 v16 H8 Z" fill="#2563eb"/>
        <text x="47" y="36" font-family="'Barlow Condensed', sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">STREAM</text>
        
        <!-- Game Title on Paper Label -->
        <text x="47" y="66" font-family="'Barlow Condensed', sans-serif" font-size="15" font-weight="900" fill="#1c1f25" text-anchor="middle">CYBERPUNK</text>
        <text x="47" y="82" font-family="'Barlow Condensed', sans-serif" font-size="15" font-weight="900" fill="#1c1f25" text-anchor="middle">2077</text>
        
        <line x1="16" y1="94" x2="78" y2="94" stroke="#c9c2b0" stroke-width="1.5"/>
        <text x="47" y="112" font-family="sans-serif" font-size="8" font-weight="700" fill="#7a7466" text-anchor="middle">ACTION RPG</text>
      </g>

      <!-- Spotlight Meta on Right -->
      <g transform="translate(132, 20)">
        <text x="0" y="16" font-family="'Barlow Condensed', sans-serif" font-size="11" font-weight="700" fill="#5ab0ff" letter-spacing="1">NEXT READY TO PLAY</text>
        <text x="0" y="42" font-family="'Barlow Condensed', sans-serif" font-size="22" font-weight="800" fill="#e8ebf0">Cyberpunk 2077</text>
        
        <!-- ProtonDB Tier & VFS Ready Badges -->
        <g transform="translate(0, 54)">
          <rect width="104" height="20" rx="4" fill="rgba(241,182,71,0.15)" stroke="#f1b647" stroke-width="1"/>
          <text x="52" y="14" font-family="sans-serif" font-size="10" font-weight="700" fill="#f1b647" text-anchor="middle">🥇 ProtonDB Gold</text>
          
          <rect x="112" y="0" width="116" height="20" rx="4" fill="rgba(63,214,164,0.15)" stroke="#3fd6a4" stroke-width="1"/>
          <text x="170" y="14" font-family="sans-serif" font-size="10" font-weight="700" fill="#3fd6a4" text-anchor="middle">⚡ Profiled (9s Boot)</text>
        </g>
        
        <text x="0" y="96" font-family="sans-serif" font-size="11.5" fill="#a0a8b6">69.2 GB on remote storage • 12.8 GB cached on MicroSD</text>

        <!-- Big Signal Action Button -->
        <rect x="0" y="108" width="160" height="32" rx="6" fill="#5ab0ff"/>
        <text x="80" y="129" font-family="'Barlow', sans-serif" font-size="13" font-weight="700" fill="#07192b" text-anchor="middle">Stream to Deck</text>
      </g>
    </g>

    <!-- 2. CARTRIDGE SHELF SECTION -->
    <g transform="translate(24, 246)">
      <text x="0" y="16" font-family="'Barlow Condensed', sans-serif" font-size="15" font-weight="700" fill="#e8ebf0" letter-spacing="0.5">REMOTE STORAGE CARTRIDGES</text>
      <text x="512" y="16" font-family="sans-serif" font-size="11" fill="#5ab0ff" text-anchor="end">See all (6)</text>
      
      <!-- Cartridge 1: Hades II -->
      <g transform="translate(0, 30)">
        <polygon points="0,0 92,0 108,16 108,124 0,124" fill="#242932" stroke="#303641" stroke-width="1"/>
        <rect x="6" y="0" width="3" height="6" fill="#0f1115" opacity="0.6"/>
        <rect x="12" y="0" width="3" height="6" fill="#0f1115" opacity="0.6"/>
        <!-- Cream Label -->
        <rect x="8" y="18" width="92" height="98" rx="4" fill="#ece7da"/>
        <path d="M8 18 h92 v14 H8 Z" fill="#9333ea"/>
        <text x="54" y="29" font-family="'Barlow Condensed', sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">READY</text>
        <text x="54" y="56" font-family="'Barlow Condensed', sans-serif" font-size="16" font-weight="900" fill="#1c1f25" text-anchor="middle">HADES II</text>
        <line x1="20" y1="72" x2="88" y2="72" stroke="#c9c2b0" stroke-width="1.5"/>
        <text x="54" y="88" font-family="sans-serif" font-size="8" font-weight="700" fill="#7a7466" text-anchor="middle">ROGUELIKE</text>
        <text x="54" y="102" font-family="sans-serif" font-size="8" font-weight="800" fill="#10b981" text-anchor="middle">11 GB VFS</text>
      </g>

      <!-- Cartridge 2: Sifu -->
      <g transform="translate(132, 30)">
        <polygon points="0,0 92,0 108,16 108,124 0,124" fill="#242932" stroke="#303641" stroke-width="1"/>
        <rect x="6" y="0" width="3" height="6" fill="#0f1115" opacity="0.6"/>
        <rect x="12" y="0" width="3" height="6" fill="#0f1115" opacity="0.6"/>
        <rect x="8" y="18" width="92" height="98" rx="4" fill="#ece7da"/>
        <path d="M8 18 h92 v14 H8 Z" fill="#059669"/>
        <text x="54" y="29" font-family="'Barlow Condensed', sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">READY</text>
        <text x="54" y="56" font-family="'Barlow Condensed', sans-serif" font-size="18" font-weight="900" fill="#1c1f25" text-anchor="middle">SIFU</text>
        <line x1="20" y1="72" x2="88" y2="72" stroke="#c9c2b0" stroke-width="1.5"/>
        <text x="54" y="88" font-family="sans-serif" font-size="8" font-weight="700" fill="#7a7466" text-anchor="middle">MARTIAL ARTS</text>
        <text x="54" y="102" font-family="sans-serif" font-size="8" font-weight="800" fill="#10b981" text-anchor="middle">24 GB VFS</text>
      </g>

      <!-- Cartridge 3: Baldur's Gate 3 -->
      <g transform="translate(264, 30)">
        <polygon points="0,0 92,0 108,16 108,124 0,124" fill="#242932" stroke="#303641" stroke-width="1"/>
        <rect x="6" y="0" width="3" height="6" fill="#0f1115" opacity="0.6"/>
        <rect x="12" y="0" width="3" height="6" fill="#0f1115" opacity="0.6"/>
        <rect x="8" y="18" width="92" height="98" rx="4" fill="#ece7da"/>
        <path d="M8 18 h92 v14 H8 Z" fill="#d97706"/>
        <text x="54" y="29" font-family="'Barlow Condensed', sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">PROFILED</text>
        <text x="54" y="52" font-family="'Barlow Condensed', sans-serif" font-size="14" font-weight="900" fill="#1c1f25" text-anchor="middle">BALDUR'S</text>
        <text x="54" y="66" font-family="'Barlow Condensed', sans-serif" font-size="14" font-weight="900" fill="#1c1f25" text-anchor="middle">GATE 3</text>
        <line x1="20" y1="74" x2="88" y2="74" stroke="#c9c2b0" stroke-width="1.5"/>
        <text x="54" y="88" font-family="sans-serif" font-size="8" font-weight="700" fill="#7a7466" text-anchor="middle">CRPG</text>
        <text x="54" y="102" font-family="sans-serif" font-size="8" font-weight="800" fill="#3b82f6" text-anchor="middle">122 GB VFS</text>
      </g>

      <!-- Cartridge 4: Control -->
      <g transform="translate(396, 30)">
        <polygon points="0,0 92,0 108,16 108,124 0,124" fill="#242932" stroke="#303641" stroke-width="1"/>
        <rect x="6" y="0" width="3" height="6" fill="#0f1115" opacity="0.6"/>
        <rect x="12" y="0" width="3" height="6" fill="#0f1115" opacity="0.6"/>
        <rect x="8" y="18" width="92" height="98" rx="4" fill="#ece7da"/>
        <path d="M8 18 h92 v14 H8 Z" fill="#dc2626"/>
        <text x="54" y="29" font-family="'Barlow Condensed', sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">READY</text>
        <text x="54" y="56" font-family="'Barlow Condensed', sans-serif" font-size="16" font-weight="900" fill="#1c1f25" text-anchor="middle">CONTROL</text>
        <line x1="20" y1="72" x2="88" y2="72" stroke="#c9c2b0" stroke-width="1.5"/>
        <text x="54" y="88" font-family="sans-serif" font-size="8" font-weight="700" fill="#7a7466" text-anchor="middle">ADVENTURE</text>
        <text x="54" y="102" font-family="sans-serif" font-size="8" font-weight="800" fill="#10b981" text-anchor="middle">42 GB VFS</text>
      </g>
    </g>

    <!-- Bottom Navigation Bar -->
    <g transform="translate(0, 455)">
      <rect width="560" height="50" rx="0" fill="#1c2027"/>
      <line x1="0" y1="0" x2="560" y2="0" stroke="#303641" stroke-width="1"/>
      
      <!-- Nav Items -->
      <text x="56" y="30" font-family="'Barlow', sans-serif" font-size="12" font-weight="700" fill="#5ab0ff" text-anchor="middle">Home</text>
      <circle cx="56" cy="40" r="2" fill="#5ab0ff"/>

      <text x="168" y="30" font-family="'Barlow', sans-serif" font-size="12" font-weight="500" fill="#a0a8b6" text-anchor="middle">Library</text>
      <text x="280" y="30" font-family="'Barlow', sans-serif" font-size="12" font-weight="500" fill="#a0a8b6" text-anchor="middle">Search</text>
      <text x="392" y="30" font-family="'Barlow', sans-serif" font-size="12" font-weight="500" fill="#a0a8b6" text-anchor="middle">Deck</text>
      <text x="504" y="30" font-family="'Barlow', sans-serif" font-size="12" font-weight="500" fill="#a0a8b6" text-anchor="middle">Settings</text>
    </g>
  </g>
</svg>