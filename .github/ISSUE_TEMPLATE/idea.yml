name: Idea or feature request
description: Propose something, with the problem it solves
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: The problem, description: "What is hard today, for whom"}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposal and how we would know it works}
  - type: markdown
    attributes:
      value: "Out of scope: anything that provides, indexes or searches for games, or circumvents protection (see CONTRIBUTING.md)."
