name: Bug (not a Deck launch)
description: Something wrong in the site, API, companion app, Decky panel or docs
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For a failed or slow launch on a Steam Deck use the *Steam Deck launch report* form instead. Remove credentials, tokens, private hosts and identifying paths."
  - type: input
    id: revision
    attributes: {label: Revision or version, description: Commit or release you ran}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Steps, description: "What you did, what you expected, what happened"}
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes: {label: Redacted output or screenshot}
