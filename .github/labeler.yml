'area: daemon':
  - changed-files:
      - any-glob-to-any-file:
          - 'daemon/**'

'area: api':
  - changed-files:
      - any-glob-to-any-file:
          - 'api/**'
          - 'scripts/storage_server.js'

'area: app':
  - changed-files:
      - any-glob-to-any-file:
          - 'index.html'
          - 'manifest.webmanifest'
          - 'sw.js'
          - 'fonts/**'

'area: decky':
  - changed-files:
      - any-glob-to-any-file:
          - 'decky/**'

'area: docs':
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - 'site/**'
          - '*.md'

'area: ci':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - '.github/labeler.yml'
          - '.github/dependabot.yml'
          - 'scripts/test_*'
          - 'scripts/run_all_tests.sh'
          - 'scripts/build_decky.sh'
          - 'scripts/make_manifest.py'
