name: Sync labels

# Runs only when a maintainer starts it from the Actions tab. It creates or updates the labels in
# .github/labels.json and never deletes a label.
on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v9
        with:
          script: |
            const wanted = require(`${process.env.GITHUB_WORKSPACE}/.github/labels.json`);
            const have = await github.paginate(github.rest.issues.listLabelsForRepo, { ...context.repo, per_page: 100 });
            const byName = new Map(have.map(l => [l.name.toLowerCase(), l]));
            for (const l of wanted) {
              const cur = byName.get(l.name.toLowerCase());
              if (!cur) {
                await github.rest.issues.createLabel({ ...context.repo, ...l });
                core.info(`created ${l.name}`);
              } else if (cur.color !== l.color || (cur.description || '') !== l.description) {
                await github.rest.issues.updateLabel({ ...context.repo, name: cur.name, color: l.color, description: l.description });
                core.info(`updated ${l.name}`);
              }
            }
