version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly, day: monday, time: "07:00", timezone: Africa/Johannesburg}
    open-pull-requests-limit: 3
    groups: {npm-patch-minor: {update-types: [minor, patch]}}
    commit-message: {prefix: "deps"}
  - package-ecosystem: npm
    directory: /decky
    schedule: {interval: weekly, day: monday, time: "07:15", timezone: Africa/Johannesburg}
    open-pull-requests-limit: 2
    groups: {decky-patch-minor: {update-types: [minor, patch]}}
    commit-message: {prefix: "deps"}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday, time: "07:30", timezone: Africa/Johannesburg}
    open-pull-requests-limit: 2
    groups: {actions-patch-minor: {update-types: [minor, patch]}}
    commit-message: {prefix: "ci"}
